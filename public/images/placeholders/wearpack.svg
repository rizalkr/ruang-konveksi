<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <rect width="240" height="240" rx="16" fill="#F8FAFC"/>
  <!-- Wearpack / Coverall Suit Body -->
  <path d="M76 52 L164 52 L198 90 L174 108 L154 88 L154 138 L150 200 L126 200 L120 156 L114 200 L90 200 L86 138 L86 88 L66 108 L42 90 Z" 
        fill="#CBD5E1" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front Zipper Line -->
  <line x1="120" y1="64" x2="120" y2="152" stroke="#334155" stroke-width="2" stroke-dasharray="3 2"/>
  <!-- Hi-Vis Safety Reflective Strips (Chest) -->
  <rect x="86" y="96" width="68" height="8" fill="#F59E0B" stroke="#334155" stroke-width="1.5"/>
  <!-- Hi-Vis Arm Bands -->
  <rect x="52" y="96" width="14" height="6" transform="rotate(-40 52 96)" fill="#F59E0B" stroke="#334155" stroke-width="1"/>
  <rect x="174" y="86" width="14" height="6" transform="rotate(40 174 86)" fill="#F59E0B" stroke="#334155" stroke-width="1"/>
  <!-- Utility Chest Pockets with Studs -->
  <rect x="92" y="112" width="18" height="18" rx="2" fill="#94A3B8" stroke="#334155" stroke-width="1.5"/>
  <circle cx="101" cy="116" r="1.5" fill="#1E293B"/>
  <rect x="130" y="112" width="18" height="18" rx="2" fill="#94A3B8" stroke="#334155" stroke-width="1.5"/>
  <circle cx="139" cy="116" r="1.5" fill="#1E293B"/>
  <!-- Waist Seam -->
  <line x1="86" y1="138" x2="154" y2="138" stroke="#334155" stroke-width="1.5"/>
  <!-- Leg Reflective Bands -->
  <rect x="90" y="174" width="24" height="6" fill="#F59E0B" stroke="#334155" stroke-width="1"/>
  <rect x="126" y="174" width="24" height="6" fill="#F59E0B" stroke="#334155" stroke-width="1"/>
  <!-- Collar -->
  <path d="M120 64 L96 48 L114 44 L120 58 L126 44 L144 48 Z" 
        fill="#94A3B8" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
</svg>
