<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <rect width="240" height="240" rx="16" fill="#F8FAFC"/>
  <!-- Jacket Body -->
  <path d="M78 60 L100 50 L140 50 L162 60 L204 110 L180 126 L158 98 L158 190 L82 190 L82 98 L60 126 L36 110 Z" 
        fill="#E2E8F0" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ribbed Collar -->
  <path d="M100 50 C108 58 132 58 140 50 L136 62 C128 66 112 66 104 62 Z" 
        fill="#94A3B8" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
  <!-- Center Zipper -->
  <line x1="120" y1="62" x2="120" y2="190" stroke="#334155" stroke-width="2.5" stroke-dasharray="3 2"/>
  <!-- Zipper Pull Tab -->
  <rect x="117" y="74" width="6" height="10" rx="1" fill="#64748B" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Left Slash Pocket -->
  <line x1="90" y1="140" x2="104" y2="162" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right Slash Pocket -->
  <line x1="150" y1="140" x2="136" y2="162" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ribbed Cuffs -->
  <rect x="36" y="108" width="12" height="16" transform="rotate(-33 36 108)" fill="#94A3B8" stroke="#334155" stroke-width="1.5"/>
  <rect x="190" y="102" width="12" height="16" transform="rotate(33 190 102)" fill="#94A3B8" stroke="#334155" stroke-width="1.5"/>
  <!-- Ribbed Waistband -->
  <rect x="82" y="190" width="76" height="12" fill="#94A3B8" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
  <line x1="95" y1="190" x2="95" y2="202" stroke="#64748B" stroke-width="1.5"/>
  <line x1="108" y1="190" x2="108" y2="202" stroke="#64748B" stroke-width="1.5"/>
  <line x1="120" y1="190" x2="120" y2="202" stroke="#64748B" stroke-width="1.5"/>
  <line x1="132" y1="190" x2="132" y2="202" stroke="#64748B" stroke-width="1.5"/>
  <line x1="145" y1="190" x2="145" y2="202" stroke="#64748B" stroke-width="1.5"/>
</svg>
